# What to track. One entry per condo project.
#
# The `url` under each source is a search or project page you can open in a
# browser yourself -- copy it from the site with the filters you want. The
# scraper paginates it and then applies `match` / `room_type` below, so the
# filtering rules are identical for every source.
#
# Cross-source naming is not guaranteed to agree: DDproperty and Livinginsider
# name sibling towers differently, so pin the exact building with `match` plus
# `exclude` and sanity-check the first run before trusting the medians.

defaults:
  deal: sale
  alerts:
    # A drop must clear BOTH thresholds before it is worth an alert.
    min_drop_pct: 1.0
    min_drop_thb: 20000
    alert_new: true
    alert_price_drop: true

watches:
  # One entry per project. Every unit is collected; the dashboard splits them
  # by bedroom count and size, so there is no need for one watch per room type.
  - id: ideo-mobi-sukhumvit-eastgate
    project: Ideo Mobi Sukhumvit Eastgate
    deal: sale

    # A listing counts if its title contains any `match` phrase and no
    # `exclude` phrase. Comparison ignores case, spacing and punctuation.
    match:
      - Ideo Mobi Sukhumvit Eastgate

    # Optional: `room_type:` here would drop other units before they are stored.
    # Left out on purpose so every room type gets a history.

    alerts:
      # Alert only on the unit shape you are shopping for. Delete this block
      # to be alerted on every unit in the project. (bedrooms: 0 means studio.)
      room_type:
        bedrooms: 1
        min_sqm: 20
        max_sqm: 40

    sources:
      ddproperty:
        url: https://www.ddproperty.com/en/property-for-sale?freetext=Ideo+Mobi+Sukhumvit+Eastgate
        max_pages: 5

      livinginsider:
        # Project pages are server-rendered; find yours in
        # https://www.livinginsider.com/sitemap-project-0.xml
        url: https://www.livinginsider.com/en/project/condo-ideo-mobi-sukhumvit-eastgate-condo-buysell
        # Each listing costs one request, so cap the work per run.
        max_listings: 60

      hipflat:
        # Disabled: Hipflat answers every non-browser request with 401.
        # See scraper/sources/hipflat.py for the full reason.
        enabled: false
        reason: >-
          Hipflat answers every non-browser request with HTTP 401, robots.txt
          included. The only user agent it serves is Googlebot, and this project
          will not impersonate a search crawler to get around a block.
        url: https://www.hipflat.co.th/en/condo/ideo-mobi-sukhumvit-eastgate
